[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksuhook"
version = "1.0.0"
description = "Per-function hook generator for KernelSU GKI builds"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ksuhook = "ksuhook.cli:main"

[tool.setuptools]
packages = ["ksuhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
